name: CI / Deploy

# dev  → staging.anymd.cc
# main → anymd.cc + www.anymd.cc
# Pull requests only run the checks.
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test cli/test/*.test.mjs
      - run: npm run build

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply anymd-$TARGET --remote --env $TARGET
      - name: Deploy Worker
        run: npx wrangler deploy --env $TARGET
      - name: Smoke test
        run: |
          host=$([ "$TARGET" = production ] && echo https://anymd.cc || echo https://staging.anymd.cc)
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$host/") && [ "$code" = 200 ] && break
            sleep 5
          done
          [ "$code" = 200 ] || { echo "Home page returned $code"; exit 1; }
          curl -sf "$host/llms.txt" > /dev/null
          curl -sf "$host/api/v1/openapi.json" > /dev/null
